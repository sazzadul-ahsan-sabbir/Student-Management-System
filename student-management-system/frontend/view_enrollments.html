<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Details</title>
    <link href="courses.html" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">🎓 Enrollment Details</h2>
        
        <div class="mb-3">
            <button onclick="loadEnrollments()" class="btn btn-primary">
                🔄 Refresh Enrollments
            </button>
        </div>
        
        <div id="loading" class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        
        <div id="enrollmentTable" class="mt-3">
            <!-- এখানে ডাটা লোড হবে -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadEnrollments();
        });

        function loadEnrollments() {
            const loading = document.getElementById('loading');
            const tableDiv = document.getElementById('enrollmentTable');
            
            loading.style.display = 'block';
            tableDiv.innerHTML = '';
            
            fetch('enrollments.php')
                .then(response => response.json())
                .then(data => {
                    loading.style.display = 'none';
                    
                    if (data.success) {
                        displayEnrollments(data.enrollments);
                    } else {
                        tableDiv.innerHTML = `
                            <div class="alert alert-warning">
                                ${data.message}
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    loading.style.display = 'none';
                    tableDiv.innerHTML = `
                        <div class="alert alert-danger">
                            Error loading enrollments: ${error}
                        </div>
                    `;
                });
        }

        function displayEnrollments(enrollments) {
            const tableDiv = document.getElementById('enrollmentTable');
            
            if (enrollments.length === 0) {
                tableDiv.innerHTML = '<p>No enrollments found</p>';
                return;
            }
            
            let html = `
                <div class="alert alert-info">
                    Total Enrollments: ${enrollments.length}
                </div>
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Student</th>
                            <th>Course</th>
                            <th>Instructor</th>
                            <th>Enrollment Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            enrollments.forEach(enroll => {
                html += `
                    <tr>
                        <td>${enroll.enrollment_id}</td>
                        <td>
                            <strong>${enroll.student_name}</strong><br>
                            <small>${enroll.email}</small>
                        </td>
                        <td>
                            ${enroll.course_code}: ${enroll.course_name}<br>
                            <small>Credits: ${enroll.credits}</small>
                        </td>
                        <td>${enroll.instructor}</td>
                        <td>${enroll.enrollment_date}</td>
                        <td>
                            <span class="badge bg-${enroll.status === 'active' ? 'success' : 'secondary'}">
                                ${enroll.status}
                            </span>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            tableDiv.innerHTML = html;
        }
    </script>
</body>
</html>
